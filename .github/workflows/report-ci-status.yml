name: Report CI status

on:
  workflow_run:
    workflows: [CI]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: report-ci-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
  queue: max

jobs:
  report:
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review') &&
      (github.event.workflow_run.actor.login == github.repository_owner ||
       github.event.workflow_run.actor.login == 'dependabot[bot]')
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/github-script@v9
        id: status
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100
            });
            const pr = prs.find(p => p.state === "open" && p.head.sha === run.head_sha &&
              p.head.ref === run.head_branch &&
              (!run.head_repository?.full_name || p.head.repo?.full_name === run.head_repository.full_name));
            if (!pr) return;
            const trusted = pr.user.login === owner ||
              (pr.head.repo?.full_name === `${owner}/${repo}` &&
                (pr.user.login === "dependabot[bot]" ||
                 ["automation/update-python-image", "automation/promote-dependency-release"].includes(pr.head.ref)));
            if (!trusted) {
              if (run.event !== "pull_request_review") return;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              const review = reviews.filter(r => r.user?.login === owner && r.state !== "COMMENTED").at(-1);
              if (review?.state !== "APPROVED" || review.commit_id !== run.head_sha) return;
            }
            const candidates = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha, per_page: 100
            });
            const runs = candidates.filter(r =>
              (r.event === "pull_request" || r.event === "pull_request_review") &&
              (trusted || r.event === "pull_request_review") &&
              r.head_branch === pr.head.ref &&
              (!r.head_repository?.full_name || r.head_repository.full_name === pr.head.repo?.full_name)
            ).sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            if (!runs.length || runs[0].id !== run.id || runs[0].run_attempt !== run.run_attempt) return;
            let state = "pending";
            if (context.payload.action === "completed") {
              const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
                owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
              });
              const gate = data.jobs.find(j => j.name === "Gated tests");
              state = run.conclusion === "success" && gate?.conclusion === "success" ? "success" : "failure";
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: run.head_sha, state, context: "CI / gated tests",
              description: `Gated tests ${state}`, target_url: `${run.html_url}/attempts/${run.run_attempt}`
            });
            if (state === "success" && run.event === "pull_request") core.setOutput("merge", "true");
      - name: Merge tested dependencies
        if: steps.status.outputs.merge == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100
            });
            const pr = prs.find(p => p.state === "open" && p.head.sha === run.head_sha &&
              p.head.ref === run.head_branch && p.head.repo?.full_name === `${owner}/${repo}` &&
              ((p.base.ref === "main" && (p.user.login === "dependabot[bot]" ||
                (p.user.login === owner && p.head.ref === "automation/update-python-image"))) ||
               (p.base.ref === "stable" && p.head.ref === "automation/promote-dependency-release" &&
                p.user.login === owner && p.labels.some(l => l.name === "dependencies"))));
            if (!pr) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const stableFiles = new Set([
              "docker-compose.yml", ".github/stable-dockerhub-ready",
              ...["image-archives.sh", "local-compose.sh", "registry-compose.sh", "release-version.sh",
                "publish-dockerhub.sh", "stamp-image-version.sh", "test-ci-authorization.js",
                "test-dependency-merge.js", "test-image-archives.sh", "test-publish-dockerhub.sh",
                "test-release-version.sh", "promote-dependencies.js", "test-promote-dependencies.js"]
                .map(name => `.github/scripts/${name}`)
            ]);
            const allowed = name => pr.head.ref === "automation/update-python-image"
              ? name === ".github/python-image-digest"
              : name === "Dockerfile" || name === ".github/python-image-digest" ||
                name.startsWith(".github/workflows/") ||
                (pr.base.ref === "stable" && stableFiles.has(name));
            if (!files.length || files.some(f => !allowed(f.filename) ||
              !["added", "modified", "removed"].includes(f.status)))
              throw new Error("Unexpected dependency changes; refusing to merge.");
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            for (const name of ["ohdio / test", "Gated tests"]) {
              if (!data.jobs.some(job => job.name === name && job.conclusion === "success"))
                throw new Error(`Required job did not pass: ${name}`);
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha, per_page: 100
            });
            const latest = runs.filter(r => r.event === "pull_request" &&
              r.head_branch === pr.head.ref).sort((a, b) =>
                b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
            if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt)
              throw new Error("A newer CI run superseded this run.");
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
              owner, repo, ref: run.head_sha, per_page: 100
            });
            const status = statuses.find(s => s.context === "CI / gated tests");
            if (status?.target_url !== `${run.html_url}/attempts/${run.run_attempt}` ||
              status.state !== "success") throw new Error("No matching successful gated status.");
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${pr.base.ref}...${run.head_sha}`
            });
            if (comparison.behind_by > 0) {
              if (pr.user.login === "dependabot[bot]") {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body: "@dependabot rebase"
                });
              } else {
                await github.rest.pulls.updateBranch({
                  owner, repo, pull_number: pr.number, expected_head_sha: run.head_sha
                });
              }
              core.info("Dependency branch is behind its base; waiting for updated CI.");
              return;
            }
            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, merge_method: "squash", sha: run.head_sha
            });
            if (!result.data.merged) throw new Error("GitHub did not merge the dependency PR.");
