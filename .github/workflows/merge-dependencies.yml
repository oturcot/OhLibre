name: Merge tested dependencies

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: merge-dependencies-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: run.head_sha, per_page: 100
            });
            const pr = prs.find(p => p.state === "open" && p.head.sha === run.head_sha &&
              p.head.repo?.full_name === `${owner}/${repo}` &&
              ((p.base.ref === "main" && (p.user.login === "dependabot[bot]" ||
                p.head.ref === "automation/update-python-image")) ||
               (p.base.ref === "stable" && p.head.ref === "automation/promote-dependency-release" &&
                p.labels.some(l => l.name === "dependencies"))));
            if (!pr) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const allowed = name => pr.head.ref === "automation/update-python-image"
              ? name === ".github/python-image-digest"
              : name === "Dockerfile" || name === ".github/python-image-digest" ||
                name.startsWith(".github/workflows/");
            if (!files.length || files.some(f => !allowed(f.filename) ||
              !["added", "modified", "removed"].includes(f.status)))
              throw new Error("Unexpected dependency changes; refusing to merge.");
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner, repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            for (const name of ["ohdio / test", "archives / images (amd64)",
              "archives / images (arm64)", "Gated tests"]) {
              if (!data.jobs.some(job => job.name === name && job.conclusion === "success"))
                throw new Error(`Required job did not pass: ${name}`);
            }
            const url = `${run.html_url}/attempts/${run.run_attempt}`;
            let status;
            for (let i = 0; i < 30; i++) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: run.workflow_id, head_sha: run.head_sha, per_page: 100
              });
              const latest = runs.workflow_runs.filter(r => r.event === "pull_request" &&
                r.head_branch === pr.head.ref).sort((a, b) =>
                  b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
              if (!latest || latest.id !== run.id || latest.run_attempt !== run.run_attempt)
                throw new Error("A newer CI run superseded this run.");
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner, repo, ref: run.head_sha, per_page: 100
              });
              status = statuses.find(s => s.context === "CI / gated tests");
              if (status?.target_url === url && status.state === "success") break;
              if (status?.target_url === url && status.state !== "pending")
                throw new Error(`CI status is ${status.state}.`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (status?.target_url !== url || status.state !== "success") throw new Error("No matching successful gated status.");
            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, merge_method: "squash", sha: run.head_sha
            });
            if (!result.data.merged) throw new Error("GitHub did not merge the dependency PR.");
