name: Package private OHdio release

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      upload-artifacts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  images:
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify the image archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --pull --platform "linux/$ARCH" --load \
            -t radio-canada-podcast:local .
          archive="radio-canada-podcast-linux-$ARCH.tar.gz"
          docker image save radio-canada-podcast:local | gzip -c > "$archive"
          docker image rm radio-canada-podcast:local
          docker image load -i "$archive"
          docker run --rm -e OHDIO_LIVE_TEST=1 \
            -v "$PWD/tests:/app/tests:ro" --entrypoint python \
            radio-canada-podcast:local -m unittest discover -s tests -v
          bash .github/scripts/local-compose.sh docker-compose.yml > release-compose.yml
          docker compose -f release-compose.yml config -q
          docker compose -f release-compose.yml run --rm --no-deps ohdio --help
          bash .github/scripts/registry-compose.sh release-compose.yml "${GITHUB_REPOSITORY_OWNER,,}" > registry-compose.yml
          docker compose -f registry-compose.yml config --format json | jq -e \
            --arg image "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-canada-podcast:latest" \
            '.services.ohdio | .image == $image and .pull_policy == "always" and
             .build == null and any(.volumes[]; .type == "bind" and .target == "/podcasts")'
      - uses: actions/upload-artifact@v7
        if: inputs.upload-artifacts
        with:
          name: ohdio-linux-${{ matrix.arch }}
          path: radio-canada-podcast-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Verify the release version in the image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash .github/scripts/stamp-image-version.sh 0.0.0-beta.0 "$ARCH"
          docker run --rm --entrypoint python radio-canada-podcast:local \
            -c 'import os; assert os.environ["OHDIO_VERSION"] == "0.0.0-beta.0"'
