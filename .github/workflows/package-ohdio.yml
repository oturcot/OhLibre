name: Package private OHdio release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and verify the image archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker compose build
          archive="radio-canada-podcast-linux-$ARCH.tar.gz"
          docker image save radio-canada-podcast:local | gzip -c > "$archive"
          docker image rm radio-canada-podcast:local
          docker image load -i "$archive"
          sed -e '/^    build: /d' -e 's/    pull_policy: build/    pull_policy: never/' \
            compose.yml > release-compose.yml
          docker compose -f release-compose.yml config -q
          docker compose -f release-compose.yml run --rm --no-deps ohdio --help
      - uses: actions/upload-artifact@v7
        with:
          name: ohdio-linux-${{ matrix.arch }}
          path: radio-canada-podcast-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
