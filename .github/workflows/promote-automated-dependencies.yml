name: Promote automated dependencies

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

jobs:
  create-stable-promotion:
    if: >-
      github.event.pull_request.merged == true &&
      (
        (
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'automation/update-container-dependencies'
        )
      )
    concurrency:
      group: promote-automated-dependencies
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Find pending stable promotion
        uses: actions/github-script@v9
        id: promotion
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:automation/promote-dependency-release`,
              base: "stable",
              per_page: 1,
            });
            core.setOutput("number", pullRequests[0]?.number ?? "");

      - name: Checkout stable
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: stable
          ref: stable
          persist-credentials: true

      - name: Checkout merged main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: main
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate merged dependency changes
        uses: actions/github-script@v9
        id: changes
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            const isContainerUpdate =
              pullRequest.head.ref === "automation/update-container-dependencies";
            const isAllowedPath = (filename) =>
              isContainerUpdate
                ? filename === "dockerfile"
                : filename.startsWith(".github/workflows/");

            if (
              files.length === 0 ||
              files.some(({ filename, status }) =>
                !isAllowedPath(filename) ||
                !["added", "modified", "removed"].includes(status)
              )
            ) {
              throw new Error("Automated dependency PR contains unexpected files; refusing promotion.");
            }

            core.setOutput("pathspec", isContainerUpdate ? "dockerfile" : ".github/workflows/");

      - name: Reconcile pending stable promotion
        if: steps.promotion.outputs.number != ''
        env:
          PULL_NUMBER: ${{ steps.promotion.outputs.number }}
        run: |
          git -C "$GITHUB_WORKSPACE/stable" fetch origin "refs/pull/${PULL_NUMBER}/head"
          git -C "$GITHUB_WORKSPACE/stable" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --squash --no-commit FETCH_HEAD

      - name: Apply only the merged dependency diff
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PATHSPEC: ${{ steps.changes.outputs.pathspec }}
        run: |
          bash main/.github/scripts/apply-dependency-promotion.sh \
            "$GITHUB_WORKSPACE/main" \
            "$GITHUB_WORKSPACE/stable" \
            "$MERGE_COMMIT_SHA" \
            "$PATHSPEC"

      - name: Open or update the stable dependency pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          path: stable
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          branch: automation/promote-dependency-release
          delete-branch: true
          base: stable
          commit-message: "chore(release): promote tested dependencies"
          title: "Promote tested dependency updates to stable"
          body: |
            Promotes only changes from a tested Dependabot or Debian/uBridge update merged into `main`.

            This pull request runs the public smoke test and Cisco integration test before auto-merge.
            Container dependency changes publish a new stable Docker image; workflow-only changes do not.
          labels: dependencies
