name: Update Python image

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/Montreal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-python-image
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.actor == github.repository_owner)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: dcarbone/install-jq-action@v4.0.1
      - uses: docker/setup-buildx-action@v4
      - name: Record the current official image digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect python:3.13-slim --format '{{json .Manifest.Digest}}' | jq -r .)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > .github/python-image-digest
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          branch: automation/update-python-image
          delete-branch: true
          base: main
          commit-message: "chore: update official Python image"
          title: "Update official Python image"
          body: "Refresh the official Python image after CI verifies both architectures."
          labels: dependencies
