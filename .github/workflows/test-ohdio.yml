name: Test OHdio

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          docker compose config -q
          docker compose build
          docker run --rm -e OHDIO_LIVE_TEST=1 \
            -v "$PWD/tests:/app/tests:ro" --entrypoint python \
            radio-canada-podcast:local -m unittest discover -s tests -v
      - name: Verify the writable host bind mount
        run: |
          mount_root="$(mktemp -d "$PWD/.bind-test.XXXXXX")"
          export PODCAST_DIR="$mount_root/podcast library"
          trap 'rm -f "$PODCAST_DIR/from-host" "$PODCAST_DIR/from-container"; rmdir "$PODCAST_DIR" "$mount_root"' EXIT
          mkdir -p "$PODCAST_DIR"
          printf 'host\n' > "$PODCAST_DIR/from-host"
          docker compose run --rm --no-deps --entrypoint sh ohdio \
            -ec 'test "$(cat /podcasts/from-host)" = host; printf "container\n" > /podcasts/from-container'
          test "$(cat "$PODCAST_DIR/from-container")" = container
