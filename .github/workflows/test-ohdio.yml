name: Test OHdio

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: |
          bash .github/scripts/test-release-version.sh
          bash .github/scripts/test-publish-ghcr.sh
          docker compose config -q
          docker build --pull -t radio-canada-podcast:local .
          docker run --rm --entrypoint python radio-canada-podcast:local -c \
            'from datetime import datetime, timezone; winter = datetime(2026, 1, 1, 12, tzinfo=timezone.utc).astimezone(); summer = datetime(2026, 7, 1, 12, tzinfo=timezone.utc).astimezone(); assert (winter.hour, summer.hour) == (7, 8), (winter, summer)'
          docker run --rm -e OHDIO_LIVE_TEST=1 \
            -v "$PWD/tests:/app/tests:ro" --entrypoint python \
            radio-canada-podcast:local -m unittest discover -s tests -v
      - name: Verify the writable host bind mount
        run: |
          mount_root="$(mktemp -d "$PWD/.bind-test.XXXXXX")"
          export PODCAST_DIR="$mount_root/podcast library"
          trap 'rm -f "$PODCAST_DIR/from-host" "$PODCAST_DIR/from-container"; rmdir "$PODCAST_DIR" "$mount_root"' EXIT
          mkdir -p "$PODCAST_DIR"
          printf 'host\n' > "$PODCAST_DIR/from-host"
          bash .github/scripts/local-compose.sh docker-compose.yml > "$RUNNER_TEMP/local-compose.yml"
          docker compose -f "$RUNNER_TEMP/local-compose.yml" run --rm --no-deps --entrypoint sh ohdio \
            -ec 'test "$(cat /podcasts/from-host)" = host; printf "container\n" > /podcasts/from-container'
          test "$(cat "$PODCAST_DIR/from-container")" = container
