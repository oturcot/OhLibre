name: Test OHdio

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          docker compose config -q
          docker compose build
          docker run --rm -e OHDIO_LIVE_TEST=1 \
            -v "$PWD/tests:/app/tests:ro" --entrypoint python \
            radio-canada-podcast:local -m unittest discover -s tests -v
      - name: Verify the writable host bind mount
        run: |
          mount_root="$(mktemp -d "$PWD/.bind-test.XXXXXX")"
          podcast_dir="$mount_root/podcast library"
          override_file="$mount_root/compose.override.yml"
          trap 'rm -f "$podcast_dir/from-host" "$podcast_dir/from-container" "$override_file"; rmdir "$podcast_dir" "$mount_root"' EXIT
          mkdir -p "$podcast_dir"
          printf 'services:\n  ohdio:\n    volumes:\n      - type: bind\n        source: "%s"\n        target: /podcasts\n' "$podcast_dir" > "$override_file"
          printf 'host\n' > "$podcast_dir/from-host"
          docker compose -f docker-compose.yml -f "$override_file" run --rm --no-deps --entrypoint sh ohdio \
            -ec 'test "$(cat /podcasts/from-host)" = host; printf "container\n" > /podcasts/from-container'
          test "$(cat "$podcast_dir/from-container")" = container
