name: Auto Assign Issues to Copilot

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  assign:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Assign Copilot
        env:
          GH_TOKEN: ${{ secrets.ISSUE_BOT_TOKEN }}
        run: |
          gh issue edit ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" \
            --add-assignee "@copilot"
