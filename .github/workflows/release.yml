name: Release

on:
  pull_request:
    branches:
      - stable
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose the version component to increment.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      release_version:
        description: Exact X.Y.Z version; required only for custom releases.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  cisco-test-and-release:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'automation/promote-dependency-release' &&
        contains(github.event.pull_request.labels.*.name, 'dependencies')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/stable'
      )
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      IOS_IMAGE_DIR: ${{ vars.IOS_IMAGE_DIR || format('{0}/ios-images', github.workspace) }}
      IOS_LICENSE_DIR: ${{ vars.IOS_LICENSE_DIR || format('{0}/ios-licence', github.workspace) }}
      IOS_IMAGE_FILE: i86bi_linux-adventerprisek9-ms.155-2.T.bin
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      update_latest: ${{ steps.version.outputs.update_latest }}
      debian_digest: ${{ steps.dependencies.outputs.debian_digest }}
      debian_image: ${{ steps.dependencies.outputs.debian_image }}
      debian_version: ${{ steps.dependencies.outputs.debian_version }}
      ubridge_ref: ${{ steps.dependencies.outputs.ubridge_ref }}
      ubridge_version: ${{ steps.dependencies.outputs.ubridge_version }}
      previous_debian_version: ${{ steps.dependencies.outputs.previous_debian_version }}
      previous_ubridge_version: ${{ steps.dependencies.outputs.previous_ubridge_version }}
      image_tag: ${{ steps.save-image.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Calculate the next stable version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
          RELEASE_VERSION: ${{ inputs.release_version || '' }}
          AUTOMATIC_MAIN_PROMOTION: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
          AUTOMATIC_PATCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'automation/promote-dependency-release' && contains(github.event.pull_request.labels.*.name, 'dependencies') }}
          TARGET_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_TYPE" in
            patch|minor|major|custom) ;;
            *)
              echo "Choose patch, minor, major, or custom." >&2
              exit 1
              ;;
          esac
          if [[ "$RELEASE_TYPE" == "custom" && -z "$RELEASE_VERSION" ]]; then
            echo "Custom releases require an exact X.Y.Z version." >&2
            exit 1
          elif [[ "$RELEASE_TYPE" != "custom" && -n "$RELEASE_VERSION" ]]; then
            echo "Set release_version only when release_type is custom." >&2
            exit 1
          fi
          existing_tag="$(git tag --points-at "$TARGET_COMMIT" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$existing_tag" ]]; then
            latest_version="$(git tag --list --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            previous_tag="$(git tag --list --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -Fxv "$existing_tag" | head -n 1 || true)"
            echo "Reusing release $existing_tag for $TARGET_COMMIT."
            echo "version=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
            if [[ "$existing_tag" == "$latest_version" ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "update_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "update_latest=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "update_latest=true" >> "$GITHUB_OUTPUT"

          latest_version="$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$latest_version" ]]; then
            latest_commit="$(git rev-list -n 1 "$latest_version")"
            if git merge-base --is-ancestor "$TARGET_COMMIT" "$latest_commit"; then
              echo "Release $latest_version already includes $TARGET_COMMIT."
              echo "version=$latest_version" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "update_latest=false" >> "$GITHUB_OUTPUT"
              exit 0
            elif ! git merge-base --is-ancestor "$latest_commit" "$TARGET_COMMIT"; then
              echo "Latest release $latest_version is not in the target commit history." >&2
              exit 1
            fi
          fi

          if [[ "$AUTOMATIC_PATCH" == "true" ]]; then
            promotion_baseline="$latest_version"
            if [[ -z "$promotion_baseline" ]]; then
              promotion_baseline="${TARGET_COMMIT}^1"
            fi
            if bash .github/scripts/has-container-input-changes.sh \
              "$GITHUB_WORKSPACE" "$promotion_baseline" "$TARGET_COMMIT"; then
              :
            else
              change_status=$?
              if [[ "$change_status" -ne 1 ]]; then
                exit "$change_status"
              fi
              echo "Workflow-only dependency promotion; skipping stable release."
              echo "version=$latest_version" >> "$GITHUB_OUTPUT"
              echo "previous_tag=$latest_version" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

          if [[ "$AUTOMATIC_MAIN_PROMOTION" == "true" ]]; then
            [[ -f .github/NEXT_VERSION ]] || {
              echo "Main-to-stable promotions require .github/NEXT_VERSION." >&2
              exit 1
            }
            next_version="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
            version="$(bash .github/scripts/calculate-stable-promotion-version.sh \
              "$next_version" "$latest_version")"
            previous_tag="$latest_version"
          elif [[ -z "$latest_version" ]]; then
            previous_tag=""
            if [[ -n "$RELEASE_VERSION" ]]; then
              [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "Custom release version must use X.Y.Z format." >&2
                exit 1
              }
              version="$RELEASE_VERSION"
            elif [[ "$RELEASE_TYPE" == "major" ]]; then
              version="1.0.0"
            else
              version="0.1.0"
            fi
          else
            IFS=. read -r current_major current_minor current_patch <<< "$latest_version"
            previous_tag="$latest_version"
            if [[ -n "$RELEASE_VERSION" ]]; then
              [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "Custom release version must use X.Y.Z format." >&2
                exit 1
              }
              IFS=. read -r requested_major requested_minor requested_patch <<< "$RELEASE_VERSION"
              version_is_greater=false
              if (( requested_major > current_major )); then
                version_is_greater=true
              elif (( requested_major == current_major && requested_minor > current_minor )); then
                version_is_greater=true
              elif (( requested_major == current_major && requested_minor == current_minor && requested_patch > current_patch )); then
                version_is_greater=true
              fi
              if [[ "$version_is_greater" != "true" ]]; then
                echo "Custom version must be greater than the latest release $latest_version." >&2
                exit 1
              fi
              version="$RELEASE_VERSION"
            elif [[ "$AUTOMATIC_PATCH" == "true" || "$RELEASE_TYPE" == "patch" ]]; then
              version="$current_major.$current_minor.$((current_patch + 1))"
            elif [[ "$RELEASE_TYPE" == "minor" ]]; then
              next_version="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
              [[ "$next_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.0$ ]] || {
                echo ".github/NEXT_VERSION must use X.Y.0 for a minor release." >&2
                exit 1
              }
              IFS=. read -r requested_major requested_minor _ <<< "$next_version"
              if (( requested_major != current_major || requested_minor <= current_minor )); then
                echo "For a minor release, NEXT_VERSION must keep X and increase Y from $latest_version." >&2
                exit 1
              fi
              version="$next_version"
            elif [[ "$RELEASE_TYPE" == "major" ]]; then
              next_version="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
              [[ "$next_version" =~ ^(0|[1-9][0-9]*)\.0\.0$ ]] || {
                echo ".github/NEXT_VERSION must use X.0.0 for a major release." >&2
                exit 1
              }
              IFS=. read -r requested_major _ _ <<< "$next_version"
              if (( requested_major <= current_major )); then
                echo "For a major release, NEXT_VERSION must increase X from $latest_version." >&2
                exit 1
              fi
              version="$next_version"
            else
              echo "Choose patch, minor, major, or provide a custom X.Y.Z version." >&2
              exit 1
            fi
          fi
          echo "Next stable release: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Validate local Cisco asset directories
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          [[ -d "$IOS_IMAGE_DIR" ]] || { echo "Missing IOS image directory: $IOS_IMAGE_DIR" >&2; exit 1; }
          [[ -d "$IOS_LICENSE_DIR" ]] || { echo "Missing IOS license directory: $IOS_LICENSE_DIR" >&2; exit 1; }
          docker info

      - name: Read pinned container dependency versions
        if: steps.version.outputs.skip != 'true'
        id: dependencies
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          debian_image="$(sed -nE 's/^ARG DEBIAN_BASE_IMAGE=(.*)$/\1/p' dockerfile)"
          ubridge_ref="$(sed -nE 's/^ARG UBRIDGE_REF=(.*)$/\1/p' dockerfile)"
          [[ "$debian_image" =~ ^debian:stable@sha256:[0-9a-f]{64}$ ]] || {
            echo "dockerfile must pin DEBIAN_BASE_IMAGE to a Debian stable digest." >&2
            exit 1
          }
          [[ "$ubridge_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "dockerfile must pin UBRIDGE_REF to a 40-character commit." >&2
            exit 1
          }
          debian_version="$(docker run --rm "$debian_image" cat /etc/debian_version \
            | tr -d '[:space:]')"
          [[ -n "$debian_version" ]] || {
            echo "Could not read the Debian version from the pinned image." >&2
            exit 1
          }
          previous_debian_image=""
          previous_ubridge_ref=""
          if [[ -n "$PREVIOUS_TAG" ]]; then
            previous_debian_image="$(git show "$PREVIOUS_TAG:dockerfile" \
              | sed -nE 's/^ARG DEBIAN_BASE_IMAGE=(.*)$/\1/p')"
            previous_ubridge_ref="$(git show "$PREVIOUS_TAG:dockerfile" \
              | sed -nE 's/^ARG UBRIDGE_REF=(.*)$/\1/p')"
          fi
          previous_debian_version=""
          if [[ -n "$previous_debian_image" ]]; then
            if [[ "$previous_debian_image" == "$debian_image" ]]; then
              previous_debian_version="$debian_version"
            else
              previous_debian_version="$(docker run --rm "$previous_debian_image" cat /etc/debian_version \
                | tr -d '[:space:]')"
            fi
            [[ -n "$previous_debian_version" ]] || {
              echo "Could not read the Debian version from the previous pinned image." >&2
              exit 1
            }
          fi
          ubridge_tags="$(git ls-remote --tags https://github.com/GNS3/ubridge.git)"
          resolve_ubridge_version() {
            awk -v ref="$1" '
              $1 == ref {
                tag = $2
                sub(/\^\{\}$/, "", tag)
                sub(/^refs\/tags\//, "", tag)
                print tag
                exit
              }
            ' <<< "$ubridge_tags"
          }
          ubridge_version="$(resolve_ubridge_version "$ubridge_ref")"
          [[ -n "$ubridge_version" ]] || {
            echo "Could not resolve a uBridge tag for commit $ubridge_ref." >&2
            exit 1
          }
          previous_ubridge_version=""
          if [[ -n "$previous_ubridge_ref" ]]; then
            previous_ubridge_version="$(resolve_ubridge_version "$previous_ubridge_ref")"
          fi
          echo "debian_image=$debian_image" >> "$GITHUB_OUTPUT"
          echo "debian_digest=${debian_image##*@}" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
          echo "ubridge_ref=$ubridge_ref" >> "$GITHUB_OUTPUT"
          echo "ubridge_version=$ubridge_version" >> "$GITHUB_OUTPUT"
          echo "previous_debian_version=$previous_debian_version" >> "$GITHUB_OUTPUT"
          echo "previous_ubridge_version=$previous_ubridge_version" >> "$GITHUB_OUTPUT"

      - name: Test end-to-end Cisco Layer 3 routing
        if: steps.version.outputs.skip != 'true'
        env:
          IOL_BASE_IMAGE_TAG: oturcot/cisco-iol:tested-${{ github.run_id }}-${{ github.run_attempt }}
          PRESERVE_BASE_IMAGE: "true"
        run: bash .github/scripts/test-cisco-compose.sh

      - name: Save tested release image
        id: save-image
        if: steps.version.outputs.skip != 'true'
        env:
          IMAGE_TAG: oturcot/cisco-iol:tested-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker image save "$IMAGE_TAG" --output "$RUNNER_TEMP/cisco-iol-image.tar"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: tested-release-image
          path: ${{ runner.temp }}/cisco-iol-image.tar
          overwrite: true
          retention-days: 1

      - name: Remove tested image from runner
        if: always()
        env:
          IMAGE_TAG: oturcot/cisco-iol:tested-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker image rm "$IMAGE_TAG" >/dev/null 2>&1 || true

  publish-stable-release:
    needs: cisco-test-and-release
    if: needs.cisco-test-and-release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Generate categorized release notes
        id: notes
        uses: actions/github-script@v9
        env:
          DEBIAN_VERSION: ${{ needs.cisco-test-and-release.outputs.debian_version }}
          UBRIDGE_VERSION: ${{ needs.cisco-test-and-release.outputs.ubridge_version }}
          PREVIOUS_DEBIAN_VERSION: ${{ needs.cisco-test-and-release.outputs.previous_debian_version }}
          PREVIOUS_UBRIDGE_VERSION: ${{ needs.cisco-test-and-release.outputs.previous_ubridge_version }}
          RELEASE_TAG: ${{ needs.cisco-test-and-release.outputs.version }}
          PREVIOUS_TAG: ${{ needs.cisco-test-and-release.outputs.previous_tag }}
          TARGET_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        with:
          script: |
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.TARGET_COMMIT,
              configuration_file_path: ".github/release.yml",
            };
            if (process.env.PREVIOUS_TAG) {
              options.previous_tag_name = process.env.PREVIOUS_TAG;
            }
            const { data } = await github.rest.repos.generateReleaseNotes(options);
            const dependencyLine = (name, previous, current) => {
              if (previous === current) return null;
              return previous
                ? `- ${name}: from \`${previous}\` to \`${current}\``
                : `- ${name}: \`${current}\``;
            };
            const dependencyLines = [
              dependencyLine("Debian", process.env.PREVIOUS_DEBIAN_VERSION, process.env.DEBIAN_VERSION),
              dependencyLine("uBridge", process.env.PREVIOUS_UBRIDGE_VERSION, process.env.UBRIDGE_VERSION),
            ].filter(Boolean);
            const body = [
              ...(dependencyLines.length
                ? ["## Container build dependencies", ...dependencyLines, ""]
                : []),
              data.body,
            ].join("\n");
            core.setOutput("body", body);

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ needs.cisco-test-and-release.outputs.version }}
          name: ${{ needs.cisco-test-and-release.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for existing stable release image
        id: image
        env:
          IMAGE_TAG: ${{ needs.cisco-test-and-release.outputs.version }}
        run: |
          set -euo pipefail
          image="oturcot/cisco-iol"
          missing_tag_pattern='manifest unknown|no such manifest|'
          missing_tag_pattern+='(^|[[:space:]])ERROR: '
          missing_tag_pattern+='docker\.io/oturcot/cisco-iol:[^[:space:]]+: '
          missing_tag_pattern+='not found([[:space:]]|$)'
          if result="$(docker buildx imagetools inspect "$image:$IMAGE_TAG" 2>&1)"; then
            digest="$(sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' <<< "$result" | head -n 1)"
            [[ -n "$digest" ]] || {
              echo "Could not read the digest for $image:$IMAGE_TAG." >&2
              exit 1
            }
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi "$missing_tag_pattern" <<< "$result"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        if: steps.image.outputs.exists != 'true'
        with:
          name: tested-release-image
          path: ${{ runner.temp }}

      - name: Publish tested stable release image
        if: steps.image.outputs.exists != 'true'
        id: publish
        env:
          IMAGE_TAG: ${{ needs.cisco-test-and-release.outputs.image_tag }}
          RELEASE_VERSION: ${{ needs.cisco-test-and-release.outputs.version }}
        run: |
          set -euo pipefail
          docker image load --input "$RUNNER_TEMP/cisco-iol-image.tar"
          docker image tag "$IMAGE_TAG" "oturcot/cisco-iol:$RELEASE_VERSION"
          docker image push "oturcot/cisco-iol:$RELEASE_VERSION"
          result="$(docker buildx imagetools inspect "oturcot/cisco-iol:$RELEASE_VERSION")"
          digest="$(sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' <<< "$result" | head -n 1)"
          [[ -n "$digest" ]] || { echo "Could not read the published image digest." >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Check whether stable release is still latest
        id: latest
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.cisco-test-and-release.outputs.version }}
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              ...context.repo,
              per_page: 100,
            });
            const stableTags = tags
              .map(({ name }) => name)
              .filter((name) => /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(name));
            stableTags.push(process.env.RELEASE_TAG);

            const compareVersions = (left, right) => {
              const leftParts = left.split(".").map(BigInt);
              const rightParts = right.split(".").map(BigInt);
              for (let index = 0; index < leftParts.length; index += 1) {
                if (leftParts[index] !== rightParts[index]) {
                  return leftParts[index] < rightParts[index] ? -1 : 1;
                }
              }
              return 0;
            };
            const latestTag = stableTags.reduce((latest, tag) =>
              compareVersions(tag, latest) > 0 ? tag : latest,
            );
            core.setOutput("is_latest", String(latestTag === process.env.RELEASE_TAG));

      - name: Update latest tag from built image
        if: >-
          needs.cisco-test-and-release.outputs.update_latest == 'true' &&
          steps.latest.outputs.is_latest == 'true' &&
          steps.image.outputs.exists != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag oturcot/cisco-iol:latest \
            "oturcot/cisco-iol@$IMAGE_DIGEST"

      - name: Update latest tag from existing stable release image
        if: >-
          needs.cisco-test-and-release.outputs.update_latest == 'true' &&
          steps.latest.outputs.is_latest == 'true' &&
          steps.image.outputs.exists == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag oturcot/cisco-iol:latest \
            "oturcot/cisco-iol@$IMAGE_DIGEST"
