name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version stable X.Y.Z'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ohdio:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable'
    uses: ./.github/workflows/test-ohdio.yml
  stable:
    needs: ohdio
    uses: ./.github/workflows/publish-ohdio.yml
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ inputs.version || github.ref_name }}
