name: Publish private OHdio release

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  archives:
    if: github.event.repository.private
    uses: ./.github/workflows/package-ohdio.yml
  release:
    needs: archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    concurrency:
      group: ohdio-release-${{ inputs.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ohdio-linux-*
          merge-multiple: true
          path: release-assets
      - name: Publish to the private GitHub repository
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          flags=()
          base="$VERSION"
          if [[ -z "$base" ]]; then
            base="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
            flags+=(--prerelease)
          fi
          if [[ ! "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release version: %s\n' "$base" >&2
            exit 1
          fi
          tag="${VERSION:-$base-beta.$GITHUB_RUN_NUMBER}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              printf 'Tag %s already points at %s, expected %s\n' "$tag" "$commit" "$GITHUB_SHA" >&2
              exit 1
            fi
            flags+=(--verify-tag)
          fi
          if release_draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_draft" == true ]]; then
              draft_target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json targetCommitish --jq .targetCommitish)"
              if [[ "$draft_target" != "$GITHUB_SHA" ]]; then
                printf 'Draft release %s targets %s, expected %s\n' "$tag" "$draft_target" "$GITHUB_SHA" >&2
                exit 1
              fi
              echo "Release $tag is still a draft; GHCR publication will validate and finalize it."
            else
              echo "Release $tag is already published; no files were replaced."
            fi
            exit 0
          fi
          sed -e '/^    build: /d' -e 's/    pull_policy: build/    pull_policy: never/' \
            compose.yml > release-assets/compose.yml
          (cd release-assets && sha256sum radio-canada-podcast-linux-{amd64,arm64}.tar.gz compose.yml > SHA256SUMS)
          bash .github/scripts/registry-compose.sh release-assets/compose.yml \
            "${GITHUB_REPOSITORY_OWNER,,}" > release-assets/docker-compose.ghcr.yml
          (cd release-assets && sha256sum docker-compose.ghcr.yml >> SHA256SUMS)
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes --draft "${flags[@]}"
  ghcr:
    if: github.event.repository.private
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-ohdio-${{ inputs.version == '' && 'beta' || 'stable' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          if [[ "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]]; then
            printf 'Refusing to publish GHCR images from an unpublished release: %s\n' "$VERSION" >&2
            exit 1
          fi
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Push the tested images to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          channel=latest
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$VERSION" == *-beta.* ]]; then
            channel=beta
            pattern='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          current_channel_version="$(printf '%s\n' "$releases" | grep -E "$pattern" | sort -V | tail -n 1 || true)"
          bash .github/scripts/publish-ghcr.sh \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-canada-podcast" "$VERSION" \
            release-assets "$current_channel_version"
  publish:
    if: github.event.repository.private
    needs: [release, ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release after GHCR succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")"
          if [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            release_id="$(jq -r .id <<< "$release")"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false >/dev/null
          fi
