name: Publish OhLibre release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
      run_id:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    concurrency:
      group: ohdio-release-${{ inputs.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dcarbone/install-jq-action@v4.0.1
      - name: Prepare the GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.ref }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          flags=()
          base="$VERSION"
          if [[ "$base" == *-beta.* ]]; then
            base="${base%-beta.*}"
            flags+=(--prerelease)
          fi
          if [[ ! "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release version: %s\n' "$base" >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          tag="$VERSION"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$commit" != "$TARGET_SHA" ]]; then
              printf 'Tag %s already points at %s, expected %s\n' "$tag" "$commit" "$TARGET_SHA" >&2
              exit 1
            fi
            flags+=(--verify-tag)
          else
            echo "Expected a reserved tag for $tag." >&2
            exit 1
          fi
          mkdir -p release-assets
          bash .github/scripts/local-compose.sh docker-compose.yml > "$RUNNER_TEMP/local-compose.yml"
          bash .github/scripts/registry-compose.sh "$RUNNER_TEMP/local-compose.yml" \
            "$DOCKERHUB_USERNAME" > release-assets/docker-compose.yml
          (cd release-assets && sha256sum docker-compose.yml > SHA256SUMS)
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>"$RUNNER_TEMP/release-error")"; then
            release_draft="$(jq -r '.draft' <<< "$release")"
            if [[ "$release_draft" == true ]]; then
              gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
              echo "Reconciled the draft release assets for $tag."
              exit 0
            fi
            echo "Release $tag is already published; validating its assets."
            assets=(docker-compose.yml SHA256SUMS)
            problems="$(jq -r '
              . as $release |
              ($ARGS.positional[] as $name |
                if any($release.assets[]; .name == $name and .state == "uploaded")
                then empty else "\($name): missing or not uploaded" end)
            ' --args "${assets[@]}" <<< "$release")"
            if [[ -n "$problems" ]]; then
              printf 'Release %s is incomplete; no files were changed:\n%s\n' "$tag" "$problems" >&2
              exit 1
            fi
            echo "Release $tag contains all expected assets; no files were replaced."
            exit 0
          elif ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" --title "$tag" --generate-notes --draft "${flags[@]}"
  dockerhub:
    needs: release
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    concurrency:
      group: dockerhub-ohlibre-${{ contains(inputs.version, '-beta.') && 'beta' || 'stable' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dcarbone/install-jq-action@v4.0.1
      - uses: docker/setup-buildx-action@v3
      - name: Download the tested images
        uses: actions/download-artifact@v8
        with:
          pattern: ohdio-linux-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Record the release version in the tested images
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            archive="release-assets/ohlibre-linux-$arch.tar.gz"
            docker image load --platform "linux/$arch" -i "$archive"
            bash .github/scripts/stamp-image-version.sh "$VERSION" "$arch"
            docker image save ohlibre:local | gzip -c > "$archive.tmp"
            mv "$archive.tmp" "$archive"
            docker image rm ohlibre:local
          done
      - name: Push the tested images to Docker Hub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ -n "$DOCKERHUB_TOKEN" ]]
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/dockerhub.XXXXXX")"
          trap 'rm -f "$DOCKER_CONFIG/config.json"; rmdir "$DOCKER_CONFIG"' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          channel=latest
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$VERSION" == *-beta.* ]]; then
            channel=beta
            pattern='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          current_channel_version="$(printf '%s\n' "$releases" | grep -E "$pattern" | sort -V | tail -n 1 || true)"
          bash .github/scripts/publish-dockerhub.sh \
            "$DOCKERHUB_USERNAME/ohlibre" "$VERSION" \
            release-assets "$current_channel_version"
  publish:
    needs: [release, dockerhub]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release after Docker Hub succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          release_draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$release_draft" == true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
