name: Publish private OHdio release

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  archives:
    if: github.event.repository.private
    uses: ./.github/workflows/package-ohdio.yml
  release:
    needs: archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ohdio-release-${{ inputs.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ohdio-linux-*
          merge-multiple: true
          path: release-assets
      - name: Publish to the private GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          flags=()
          base="$VERSION"
          if [[ -z "$base" ]]; then
            base="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
            flags+=(--prerelease)
          fi
          if [[ ! "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release version: %s\n' "$base" >&2
            exit 1
          fi
          tag="${VERSION:-$base-beta.$GITHUB_RUN_NUMBER}"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              printf 'Tag %s already points at %s, expected %s\n' "$tag" "$commit" "$GITHUB_SHA" >&2
              exit 1
            fi
            flags+=(--verify-tag)
          fi
          images=(radio-canada-podcast-linux-{amd64,arm64}.tar.gz)
          assets=("${images[@]}" compose.yml SHA256SUMS)
          release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | {draft, assets}")"
          if [[ -n "$release" ]]; then
            problems="$(jq -r '
              . as $release |
              (if .draft != false then "release is still a draft" else empty end),
              ($ARGS.positional[] as $name |
                if any($release.assets[]; .name == $name and .state == "uploaded")
                then empty else "\($name): missing or not uploaded" end)
            ' --args "${assets[@]}" <<< "$release")"
            if [[ -n "$problems" ]]; then
              printf 'Release %s is incomplete; no files were changed:\n%s\n' "$tag" "$problems" >&2
              exit 1
            fi
            echo "Release $tag is published with all expected files; no files were replaced."
            exit 0
          fi
          sed -e '/^    build: /d' -e 's/    pull_policy: build/    pull_policy: never/' \
            docker-compose.yml > release-assets/compose.yml
          (cd release-assets && sha256sum "${images[@]}" compose.yml > SHA256SUMS)
          gh release create "$tag" "${assets[@]/#/release-assets/}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes "${flags[@]}"
