name: Publish private OHdio release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
      run_id:
        type: string
        required: true

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    concurrency:
      group: ohdio-release-${{ inputs.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ohdio-linux-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Record the release version in the tested images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -f .github/scripts/stamp-image-version.sh ]]; then
            for arch in amd64 arm64; do
              archive="release-assets/radio-canada-podcast-linux-$arch.tar.gz"
              docker image load --platform "linux/$arch" -i "$archive"
              bash .github/scripts/stamp-image-version.sh "$VERSION" "$arch"
              docker image save radio-canada-podcast:local | gzip -c > "$archive.tmp"
              mv "$archive.tmp" "$archive"
              docker image rm radio-canada-podcast:local
            done
          else
            echo "::warning::Legacy commit has no startup version support; publishing its original tested images."
          fi
      - name: Publish to the private GitHub repository
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          flags=()
          base="$VERSION"
          if [[ "$base" == *-beta.* ]]; then
            base="${base%-beta.*}"
            flags+=(--prerelease)
          fi
          if [[ ! "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release version: %s\n' "$base" >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          tag="$VERSION"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$existing" ]]; then
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
            if [[ "$commit" != "$TARGET_SHA" ]]; then
              printf 'Tag %s already points at %s, expected %s\n' "$tag" "$commit" "$TARGET_SHA" >&2
              exit 1
            fi
            flags+=(--verify-tag)
          else
            echo "Expected a reserved tag for $tag." >&2
            exit 1
          fi
          sed -e '/^    build: /d' -e 's/    pull_policy: build/    pull_policy: never/' \
            docker-compose.yml > release-assets/compose.yml
          (cd release-assets && sha256sum radio-canada-podcast-linux-{amd64,arm64}.tar.gz compose.yml > SHA256SUMS)
          bash .github/scripts/registry-compose.sh release-assets/compose.yml \
            "${GITHUB_REPOSITORY_OWNER,,}" > release-assets/docker-compose.ghcr.yml
          (cd release-assets && sha256sum docker-compose.ghcr.yml >> SHA256SUMS)
          if release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>"$RUNNER_TEMP/release-error")"; then
            release_draft="$(jq -r '.draft' <<< "$release")"
            if [[ "$release_draft" == true ]]; then
              gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
              echo "Reconciled the draft release assets for $tag."
              exit 0
            fi
            echo "Release $tag is already published; validating its assets."
            assets=(radio-canada-podcast-linux-{amd64,arm64}.tar.gz compose.yml docker-compose.ghcr.yml SHA256SUMS)
            problems="$(jq -r '
              . as $release |
              ($ARGS.positional[] as $name |
                if any($release.assets[]; .name == $name and .state == "uploaded")
                then empty else "\($name): missing or not uploaded" end)
            ' --args "${assets[@]}" <<< "$release")"
            if [[ -n "$problems" ]]; then
              printf 'Release %s is incomplete; no files were changed:\n%s\n' "$tag" "$problems" >&2
              exit 1
            fi
            echo "Release $tag contains all expected assets; no files were replaced."
            exit 0
          elif ! grep -Fq '(HTTP 404)' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" --title "$tag" --generate-notes --draft "${flags[@]}"
  ghcr:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ghcr-ohdio-${{ contains(inputs.version, '-beta.') && 'beta' || 'stable' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Push the tested images to private GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == true ]]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          channel=latest
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$VERSION" == *-beta.* ]]; then
            channel=beta
            pattern='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          fi
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          current_channel_version="$(printf '%s\n' "$releases" | grep -E "$pattern" | sort -V | tail -n 1 || true)"
          bash .github/scripts/publish-ghcr.sh \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/radio-canada-podcast" "$VERSION" \
            release-assets "$current_channel_version"
  publish:
    needs: [release, ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release after GHCR succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          release_draft="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$release_draft" == true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
