name: Container dependency updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-dependency-updates
  cancel-in-progress: false

jobs:
  create-update-pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Resolve upstream dependency versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          debian_digest="$(docker buildx imagetools inspect debian:stable \
            | awk '$1 == "Digest:" && !seen++ {digest = $2} END {print digest}')"
          [[ "$debian_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve the Debian stable image digest." >&2
            exit 1
          }
          debian_image="debian:stable@$debian_digest"
          debian_version="$(docker run --rm "$debian_image" cat /etc/debian_version \
            | tr -d '[:space:]')"
          [[ -n "$debian_version" ]] || {
            echo "Could not read the Debian version from the pinned image." >&2
            exit 1
          }

          ubridge_release_tag="$(curl -fsSL \
            --oauth2-bearer "$GITHUB_TOKEN" \
            https://api.github.com/repos/GNS3/ubridge/releases/latest \
            | jq -er '.tag_name | select(type == "string" and length > 0)')"
          ubridge_ref="$(git ls-remote https://github.com/GNS3/ubridge.git \
            "refs/tags/$ubridge_release_tag" "refs/tags/$ubridge_release_tag^{}" \
            | awk '$2 ~ /\^\{\}$/ {peeled = $1} $2 !~ /\^\{\}$/ {direct = $1} END {print peeled ? peeled : direct}')"
          [[ "$ubridge_ref" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Could not resolve the commit for uBridge release $ubridge_release_tag." >&2
            exit 1
          }

          current_debian_image="$(awk -F= '/^ARG DEBIAN_BASE_IMAGE=/ {print $2; exit}' dockerfile)"
          current_ubridge_ref="$(awk -F= '/^ARG UBRIDGE_REF=/ {print $2; exit}' dockerfile)"
          if [[ -z "$current_debian_image" || -z "$current_ubridge_ref" ]]; then
            echo "Could not read the pinned container dependencies from dockerfile." >&2
            exit 1
          fi

          echo "debian_image=$debian_image" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
          echo "ubridge_ref=$ubridge_ref" >> "$GITHUB_OUTPUT"
          echo "ubridge_release_tag=$ubridge_release_tag" >> "$GITHUB_OUTPUT"
          if [[ "$current_debian_image" == "$debian_image" &&
                "$current_ubridge_ref" == "$ubridge_ref" ]]; then
            echo "No Debian or uBridge update detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release bot token
        if: steps.versions.outputs.changed == 'true'
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_BOT_TOKEN" ]]; then
            echo "RELEASE_BOT_TOKEN is not configured; cannot create the dependency pull request." >&2
            exit 1
          fi
          if ! curl -fsS -o /dev/null \
            --oauth2-bearer "$RELEASE_BOT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY"; then
            echo "RELEASE_BOT_TOKEN is invalid or expired; cannot create the dependency pull request." >&2
            exit 1
          fi

      - name: Update pinned dependency versions
        if: steps.versions.outputs.changed == 'true'
        env:
          DEBIAN_BASE_IMAGE: ${{ steps.versions.outputs.debian_image }}
          UBRIDGE_REF: ${{ steps.versions.outputs.ubridge_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("dockerfile")
          content = path.read_text()
          for name, value in (
              ("DEBIAN_BASE_IMAGE", os.environ["DEBIAN_BASE_IMAGE"]),
              ("UBRIDGE_REF", os.environ["UBRIDGE_REF"]),
          ):
              content, replacements = re.subn(
                  rf"^ARG {name}=.*$",
                  f"ARG {name}={value}",
                  content,
                  count=1,
                  flags=re.MULTILINE,
              )
              if replacements != 1:
                  raise SystemExit(f"Expected one ARG {name} declaration in dockerfile.")
          path.write_text(content)
          PY

      - name: Open or update the dependency pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          branch: automation/update-container-dependencies
          delete-branch: true
          add-paths: dockerfile
          commit-message: "chore(deps): pin Debian and uBridge refs"
          title: "Update pinned Debian and uBridge versions"
          body: |
            Updates the pinned container build dependencies.

            - Debian: `${{ steps.versions.outputs.debian_version }}`
            - uBridge release: `${{ steps.versions.outputs.ubridge_release_tag }}`

            CI must pass before this pull request can merge into `main`.
            Promote `main` to `stable` to publish a Docker image and GitHub release.
          labels: dependencies
