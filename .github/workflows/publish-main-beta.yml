name: Publish main beta

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-main-beta
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find the next tested commit without a beta release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success") | [.head_sha, .id] | @tsv' \
            > "$RUNNER_TEMP/successful-main-runs"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true and .draft == false) | .tag_name' \
            > "$RUNNER_TEMP/beta-releases"
          selection="$(bash .github/scripts/select-main-beta.sh \
            "$RUNNER_TEMP/successful-main-runs" "$RUNNER_TEMP/beta-releases")"
          read -r sha run_id <<< "$selection"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ -n "$sha" ]]; then
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$run_id" =~ ^[0-9]+$ ]]
            echo "reserved=$(bash .github/scripts/find-reserved-beta-tag.sh "$sha")" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        if: steps.pending.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git switch --detach "$TARGET_SHA"

      - name: Calculate beta version
        if: steps.pending.outputs.sha != ''
        id: version
        env:
          RESERVED_TAG: ${{ steps.pending.outputs.reserved }}
        run: |
          set -euo pipefail
          next_version="$(tr -d '[:space:]' < .github/NEXT_VERSION)"
          latest_version="$(git tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$RESERVED_TAG" ]]; then
            beta_tag="$RESERVED_TAG"
          else
            beta_tag="$(bash .github/scripts/calculate-beta-version.sh \
              "$next_version" "$latest_version" \
              "$(git tag --list '*-beta.*')")"
          fi
          echo "tag=$beta_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_version" >> "$GITHUB_OUTPUT"
          latest_beta_tag="$(printf '%s\n%s\n' \
            "$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$' || true)" \
            "$beta_tag" | sort -V | tail -n 1)"
          echo "update_beta=$([[ "$beta_tag" == "$latest_beta_tag" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Reserve beta version for the tested commit
        if: steps.pending.outputs.sha != '' && steps.pending.outputs.reserved == ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
          BETA_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$BETA_TAG" -f "sha=$TARGET_SHA"

      - name: Mark beta publication pending
        if: steps.pending.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
        run: |
          set -euo pipefail
          marker="beta-publish-pending-$TARGET_SHA"
          if ! git show-ref --verify --quiet "refs/tags/$marker"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$marker" -f "sha=$TARGET_SHA"
            git tag "$marker" "$TARGET_SHA"
          fi

      - name: Generate beta release notes
        if: steps.pending.outputs.sha != ''
        id: notes
        uses: actions/github-script@v9
        env:
          BETA_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
        with:
          script: |
            const options = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.BETA_TAG,
              target_commitish: process.env.TARGET_SHA,
              configuration_file_path: ".github/release.yml",
            };
            if (process.env.PREVIOUS_TAG) {
              options.previous_tag_name = process.env.PREVIOUS_TAG;
            }
            const { data } = await github.rest.repos.generateReleaseNotes(options);
            const body = [
              "Pre-release built from `main`.",
              `Docker image: \`oturcot/cisco-iol:${process.env.BETA_TAG}\``,
              "",
              data.body,
            ].join("\n");
            core.setOutput("body", body);

      - name: Create GitHub beta release
        if: steps.pending.outputs.sha != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.pending.outputs.sha }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: false
          prerelease: true
          make_latest: false

      - uses: docker/setup-buildx-action@v4
        if: steps.pending.outputs.sha != ''

      - name: Log in to Docker Hub
        if: steps.pending.outputs.sha != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for existing beta image
        if: steps.pending.outputs.sha != ''
        id: image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          image="oturcot/cisco-iol"
          missing_tag_pattern='manifest unknown|no such manifest|'
          missing_tag_pattern+='(^|[[:space:]])ERROR: '
          missing_tag_pattern+='docker\.io/oturcot/cisco-iol:[^[:space:]]+: '
          missing_tag_pattern+='not found([[:space:]]|$)'
          if result="$(docker buildx imagetools inspect "$image:$IMAGE_TAG" 2>&1)"; then
            digest="$(sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' <<< "$result" | head -n 1)"
            [[ -n "$digest" ]] || { echo "Could not read the digest for $image:$IMAGE_TAG." >&2; exit 1; }
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi "$missing_tag_pattern" <<< "$result"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        if: steps.pending.outputs.sha != '' && steps.image.outputs.exists != 'true'
        with:
          name: tested-beta-image
          path: ${{ runner.temp }}
          run-id: ${{ steps.pending.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Publish tested beta image
        if: steps.pending.outputs.sha != '' && steps.image.outputs.exists != 'true'
        id: publish
        env:
          BETA_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          docker image load --input "$RUNNER_TEMP/cisco-iol-image.tar"
          IMAGE_TAG="$(cat "$RUNNER_TEMP/cisco-iol-image-tag.txt")"
          docker image tag "$IMAGE_TAG" "oturcot/cisco-iol:$BETA_TAG"
          docker image push "oturcot/cisco-iol:$BETA_TAG"
          result="$(docker buildx imagetools inspect "oturcot/cisco-iol:$BETA_TAG")"
          digest="$(sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' <<< "$result" | head -n 1)"
          [[ -n "$digest" ]] || { echo "Could not read the published image digest." >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Update rolling beta tag
        if: steps.pending.outputs.sha != '' && steps.version.outputs.update_beta == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag oturcot/cisco-iol:beta \
            "oturcot/cisco-iol@$IMAGE_DIGEST"

      - name: Clear retry markers after publication
        if: steps.pending.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/beta-publish-pending-$TARGET_SHA"
          while IFS= read -r tag; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              || echo "::warning::Could not delete retry marker $tag"
          done < <(git for-each-ref --format='%(refname:strip=2)' "refs/tags/beta-publish-retry-$TARGET_SHA-*")

      - name: Defer a failed publication
        if: failure() && steps.pending.outputs.sha != ''
        id: retry
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          TARGET_SHA: ${{ steps.pending.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t old_tags < <(git for-each-ref --format='%(refname:strip=2)' "refs/tags/beta-publish-retry-$TARGET_SHA-*")
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/beta-publish-retry-$TARGET_SHA-$(date +%s)" -f "sha=$TARGET_SHA"
          for tag in "${old_tags[@]}"; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              || echo "::warning::Could not delete retry marker $tag"
          done

      - name: Continue draining the backlog
        if: always() && steps.pending.outputs.sha != '' && (success() || steps.retry.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: gh workflow run publish-main-beta.yml --ref main
