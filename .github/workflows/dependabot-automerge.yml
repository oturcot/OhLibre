name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-after-tests:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Merge automated dependency pull request after successful tests
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            });
            const pullRequest = pullRequests.find((pr) => {
              if (pr.state !== "open" || pr.head.sha !== run.head_sha) {
                return false;
              }

              return (
                (
                  pr.base.ref === "main" &&
                  (
                    pr.user.login === "dependabot[bot]" ||
                    (
                      pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                      pr.head.ref === "automation/update-container-dependencies"
                    )
                  )
                ) ||
                (
                  pr.base.ref === "stable" &&
                  pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                  pr.head.ref === "automation/promote-dependency-release" &&
                  pr.labels.some((label) => label.name === "dependencies")
                )
              );
            });

            if (!pullRequest) {
              core.info("No eligible automated dependency pull request matches this CI run.");
              return;
            }

            let gatedStatus;
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: run.head_sha,
                per_page: 100,
              });
              gatedStatus = statuses.find((status) =>
                status.context === "CI / gated tests" &&
                status.target_url === `${run.html_url}/attempts/${run.run_attempt}`
              );
              if (gatedStatus?.state === "success") {
                break;
              }
              if (gatedStatus && gatedStatus.state !== "pending") {
                core.setFailed(
                  `Not merging: gated tests reported ${gatedStatus.state}.`
                );
                return;
              }
              if (attempt < 29) {
                await new Promise((resolve) => setTimeout(resolve, 10_000));
              }
            }

            if (gatedStatus?.state !== "success") {
              core.setFailed(
                "Not merging: gated test status was not reported for this CI run."
              );
              return;
            }

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const jobs = new Map(data.jobs.map((job) => [job.name, job.conclusion]));
            const requiredJobs = [
              "public-smoke-test",
              "local-cisco-integration-test",
              "CI test outcome",
            ];
            const failedJobs = requiredJobs.filter((name) => jobs.get(name) !== "success");

            if (failedJobs.length > 0) {
              core.setFailed(`Not merging: required CI jobs did not pass: ${failedJobs.join(", ")}`);
              return;
            }

            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              merge_method: "squash",
              sha: run.head_sha,
            });

            if (!result.data.merged) {
              core.setFailed(`GitHub did not merge Dependabot PR #${pullRequest.number}.`);
              return;
            }

            core.notice(`Merged Dependabot PR #${pullRequest.number} after all required CI jobs passed.`);
