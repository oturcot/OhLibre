name: CI

on:
  pull_request:
    branches: [main, stable]
  push:
    branches: [main, stable]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ohdio:
    uses: ./.github/workflows/test-ohdio.yml
  archives:
    if: github.event_name != 'push'
    needs: ohdio
    uses: ./.github/workflows/package-ohdio.yml
  beta:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ohdio
    uses: ./.github/workflows/publish-ohdio.yml
    permissions:
      contents: write
      packages: write
